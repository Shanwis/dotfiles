[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window]
decorations = "None"

[window.padding]
x = 10
y = 10

[cursor]
style = "Beam"

[selection]
save_to_clipboard = true

[general]
import = [
  "~/.config/alacritty/themes/themes/catppuccin_mocha.toml"
]
